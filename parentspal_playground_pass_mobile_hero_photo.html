function detail(id){let v=V.find(x=>x.id===id);s.detail=id;app.innerHTML=`<div class="panel"><button class="secondary" onclick="go('home')">← Back</button><div class="hero-art" style="min-height:140px;margin:15px 0">${v.icon}</div><div class="eyebrow">${v.area} · ${v.age}</div><h2>${v.name}</h2><p>${v.desc}</p><div class="line"><span>Regular admission</span><b>${m(v.price)}</b></div><div class="line"><span>Pass admission (3–12% saving)</span><b>${m(v.price*.88)}–${m(v.price*.97)}</b></div><div class="line"><span>Venue policy</span><b>${v.policy}</b></div><div class="line"><span>Eligible discounted window</span><b>${v.window}</b></div><p class="muted">Pass does not expire. The discount is subject to the venue's stated time window and booking policy.</p><button class="primary" onclick="go('family')">Build my pass</button></div>`}
function family(){
const ageFields=Array.from({length:s.kids},(_,i)=>`<div class="field"><label for="childAge${i}">Child ${i+1} age</label><input id="childAge${i}" type="number" min="0" max="17" value="${s.childAges[i]??''}" placeholder="Age in years" oninput="s.childAges[${i}]=this.value"></div>`).join('');
app.innerHTML=`${prog(0)}<div class="eyebrow">Personalize your pass</div><h1>Who's going to play?</h1><p>Tell us how many adults and children are in your group. Add each child's age so you can find age-appropriate play spots.</p><div class="panel" style="max-width:620px">
<div class="field"><label for="adultCount">Number of adults</label><select id="adultCount" onchange="s.adults=+this.value">${Array.from({length:9},(_,n)=>`<option value="${n}" ${s.adults===n?'selected':''}>${n}</option>`).join('')}</select></div>
<div class="field"><label for="kidCount">Number of children</label><select id="kidCount" onchange="setKids(+this.value)">${Array.from({length:9},(_,n)=>`<option value="${n}" ${s.kids===n?'selected':''}>${n}</option>`).join('')}</select></div>
${s.kids?`<div style="margin-top:16px"><b>Children's ages</b><p class="muted" style="margin:3px 0 8px">Enter an age for each child.</p>${ageFields}</div>`:'<p class="muted">No children added yet.</p>'}
<label><input type="checkbox" id="gift" ${s.gift?'checked':''} style="width:auto"> I'm buying this as a gift</label>
<div class="actions"><button class="secondary" onclick="go('home')">Back</button><button class="primary" onclick="saveFam()">Next: choose playgrounds →</button></div></div>`
}
function setKids(n){s.kids=n;s.childAges=s.childAges.slice(0,n);while(s.childAges.length<n)s.childAges.push('');family()}

function select(){app.innerHTML=`${prog(1)}<div class="eyebrow">Build your own bundle</div><h1>Choose your play stops</h1><p>Choose at least 3 admissions. Adjust quantities for each playground.</p><div class="cols"><div class="panel">${V.map(v=>`<div class="venuechoice"><div class="vicon">${v.icon}</div><div><b>${v.name}</b><div class="muted">${v.area} · ${m(v.price)} regular / ${m(v.price*.9)} pass</div><div class="muted">${v.policy}</div><div class="muted">Pass window: ${v.window}</div></div><div class="qty"><button onclick="change('${v.id}',-1)">−</button><b>${s.qty[v.id]}</b><button onclick="change('${v.id}',1)">+</button></div></div>`).join('')}<div class="notice">Sample pricing: 10% off selected admissions. Booking and time-window policies vary by venue.</div><div class="actions"><button class="secondary" onclick="go('family')">Back</button><button class="primary" ${count()<3?'disabled':''} onclick="go('review')">Calculate my pass →</button></div></div><aside class="summary"><div class="eyebrow">Your bundle</div><h2>${count()} admissions</h2><div class="line"><span>Regular subtotal</span><b>${m(sub())}</b></div><div class="line"><span>Discount (10%)</span><b>−${m(sub()*.1)}</b></div><div class="line total"><span>Pass total</span><span>${m(total())}</span></div><p class="muted">${count()<3?'Add '+(3-count())+' more admissions.':'Minimum met.'}</p></aside></div>`}
function review(){app.innerHTML=`${prog(2)}<div class="eyebrow">Pass preview</div><h1>More play, with savings.</h1><div class="cols"><div class="panel">${V.filter(v=>s.qty[v.id]).map(v=>`<div class="venuechoice"><div class="vicon">${v.icon}</div><div><b>${v.name} × ${s.qty[v.id]}</b><div class="muted">${m(v.price*.9)} each · ${v.policy}</div></div><b>${m(v.price*.9*s.qty[v.id])}</b></div>`).join('')}<h3>Pass terms</h3><ul class="terms"><li>No expiry date on unused admissions.</li><li>Each venue's booking policy applies: some accept walk-ins, others require advance booking.</li><li>Discounted rates apply only during the venue's eligible window shown in its details.</li><li>Outside that window, a venue may charge an additional fee; confirm price and availability before booking.</li><li>Proposed policy for testing: unused pass refundable within 7 days; booked visits changeable up to 24 hours ahead. Needs partner/legal review.</li></ul><div class="notice">No booking is automatically included. Follow each playground's own process to reserve or walk in.</div><div class="actions"><button class="secondary" onclick="go('select')">Edit bundle</button><button class="primary" onclick="go('checkout')">Continue to checkout →</button></div></div><aside class="summary"><div class="line"><span>Regular total</span><b>${m(sub())}</b></div><div class="line"><span>You save</span><b>−${m(sub()*.1)}</b></div><div class="line total"><span>Pay today</span><span>${m(total())}</span></div></aside></div>`}
function checkout(){app.innerHTML=`${prog(3)}<div class="eyebrow">Simulated checkout</div><h1>${s.gift?'Send a play-filled gift':'Almost ready for play'}</h1><div class="cols"><div class="panel"><b>Payment method</b><div class="grid" style="grid-template-columns:1fr 1fr;margin:10px 0">${['Apple Pay','Google Pay','Shop Pay','Card'].map(p=>`<button class="secondary" style="${s.pay===p?'border:2px solid var(--green)':''}" onclick="s.pay='${p}';checkout()">${p}</button>`).join('')}</div><div class="field"><label>Email for pass delivery</label><input id="email" type="email" value="${s.email}" placeholder="you@example.com"></div><div class="field"><label>Name</label><input id="name" value="${s.name}" placeholder="Your name"></div>${s.gift?'<div class="notice">Gift recipient details would be collected here in a production checkout. Gift delivery is simulated.</div>':''}<div class="notice">Demo only—no charge, account, or email will be created.</div><div class="actions"><button class="secondary" onclick="go('review')">Back</button><button class="primary" onclick="buy()">Complete purchase · ${m(total())}</button></div></div><aside class="summary"><div class="line"><span>Admissions</span><b>${count()}</b></div><div class="line"><span>Discount</span><b>−${m(sub()*.1)}</b></div><div class="line total"><span>Total</span><span>${m(total())}</span></div></aside></div>`}
function groupDetails(){const ages=s.childAges.map((a,i)=>`Child ${i+1}: ${a!==''?`${a} years`:'age not provided'}`).join(' · ');return `<div class="ticketline"><span>Group size</span><b>${s.adults} adult${s.adults===1?'':'s'} · ${s.kids} child${s.kids===1?'':'ren'}</b></div><div class="ticketline"><span>Children's ages</span><b>${s.kids?ages:'No children'}</b></div>`}
function venueAdmissions(){return V.filter(v=>s.qty[v.id]).map(v=>`<div class="ticketline"><span>${v.icon} ${v.name}</span><b>${s.qty[v.id]} admission${s.qty[v.id]===1?'':'s'}</b></div>`).join('')}
function purchased(){app.innerHTML=`<div class="center"><div class="eyebrow">Purchase complete · simulated</div><h1>Let the fun begin!</h1><p>In a real launch, your pass would be emailed to you.</p></div><div class="ticket"><div class="row"><div><div class="eyebrow">ParentsPal</div><h2>Play Pass</h2></div><span class="pill">No expiry</span></div><div class="ticketline"><span>Pass ID</span><b>PP-DEMO-1048</b></div><div class="ticketline"><span>Purchase date</span><b>Oct 22, 2026</b></div><div class="ticketline"><span>Expiry date</span><b>No expiry</b></div><div class="ticketline"><span>Admissions purchased</span><b>${count()}</b></div>${groupDetails()}<div style="margin:12px 0 4px;font-weight:800;color:var(--ink)">Admissions by playground</div>${venueAdmissions()}<div class="ticketline"><span>Paid</span><b>${m(total())}</b></div><div class="ticketline"><span>Receipt email</span><b>${s.email}</b></div><p class="muted">Create an account to store your pass and access it later.</p><div class="actions"><button class="primary" onclick="go('account')">Create account to store pass</button></div></div>`}
function account(){app.innerHTML=`<div class="center"><div class="eyebrow">Optional demo account</div><h1>Keep your pass close</h1><p>Checkout information is prefilled for convenience.</p></div><div class="panel" style="max-width:520px;margin:auto"><div class="field"><label>Name</label><input id="aname" value="${s.name}"></div><div class="field"><label>Email</label><input id="aemail" value="${s.email}"></div><div class="notice good">Account creation is simulated.</div><div class="actions"><button class="secondary" onclick="go('passes')">Not now</button><button class="primary" onclick="s.name=$('aname').value;s.email=$('aemail').value;go('passes')">Create demo account</button></div></div>`}
function passes(){app.innerHTML=`<div class="eyebrow">Your demo account</div><h1>My pass</h1><p>Use the venue's own booking or walk-in policy to plan your visit.</p><div class="ticket"><div class="row"><h2>Play Pass</h2><span class="pill">Active</span></div><div class="ticketline"><span>Pass ID</span><b>PP-DEMO-1048</b></div><div class="ticketline"><span>Purchase date</span><b>Oct 22, 2026</b></div><div class="ticketline"><span>Expiry date</span><b>No expiry</b></div><div class="ticketline"><span>Admissions purchased</span><b>${count()}</b></div>${groupDetails()}<div style="margin:12px 0 4px;font-weight:800;color:var(--ink)">Admissions by playground</div>${venueAdmissions()}<div class="muted" style="margin-top:10px">For redemption, show this pass ID and the admission count for the venue you visit. Venue booking and entry rules still apply.</div><div class="actions"><button class="secondary" onclick="go('home')">Explore venues</button><button class="primary" onclick="go('booking')">Plan a visit</button></div></div>`}
function booking(){let chosen=V.filter(x=>s.qty[x.id]>0);if(!chosen.length){go('select');return}if(!s.qty[s.venue])s.venue=chosen[0].id;let v=V.find(x=>x.id===s.venue);let included=['9:00 AM','10:00 AM','12:00 PM'].includes(s.slot);s.outside=!included;app.innerHTML=`<div class="eyebrow">Visit planning</div><h1>${v.walk?'Walk-in visit':'Book your visit'}</h1><p>${v.walk?'This playground accepts walk-ins in this demo. Online booking is not required; check venue hours/capacity before you go.':'This playground requires advance booking. Select a demo date and time to request a reservation.'}</p><div class="cols"><div class="panel"><div class="field"><label>Playground</label><select onchange="s.venue=this.value;booking()">${V.filter(x=>s.qty[x.id]).map(x=>`<option value="${x.id}" ${x.id===s.venue?'selected':''}>${x.name} — ${x.walk?'walk-in':'advance booking'}</option>`).join('')}</select></div>${v.walk?`<div class="notice good"><b>Walk-in policy:</b> Your pass is used at the venue. No ParentsPal time-slot booking is simulated for this location. Confirm operating hours and availability directly with the playground.</div><div class="field"><label>Optional planned visit date</label><input type="date" id="date" value="${s.date}" onchange="s.date=this.value"></div><div class="actions"><button class="secondary" onclick="go('passes')">Back</button><button class="primary" onclick="go('walkin')">Show walk-in pass instructions</button></div>`:`<div class="field"><label>Visit date</label><input type="date" value="${s.date}" onchange="s.date=this.value"></div><div class="slots"><b>Available demo time slots</b>${['9:00 AM','10:00 AM','12:00 PM','4:00 PM'].map(t=>`<button class="${s.slot===t?'selected':''}" onclick="s.slot='${t}';booking()">${t}<span style="float:right">${['9:00 AM','10:00 AM','12:00 PM'].includes(t)?'Pass window':'Outside window'}</span></button>`).join('')}</div><div class="notice ${s.outside?'':'good'}">${s.outside?`Outside the illustrative pass window. Demo additional fee: ${m(v.fee)} per admission. Final surcharge and availability must be confirmed by venue.`:'Within illustrative discounted window; no demo surcharge.'}</div><div class="actions"><button class="secondary" onclick="go('passes')">Back</button><button class="primary" onclick="go('booked')">Confirm demo booking</button></div>`}</div><aside class="summary"><h3>${v.name}</h3><div class="line"><span>Venue policy</span><b>${v.policy}</b></div><div class="line"><span>Pass time window</span><b>${v.window}</b></div>${!v.walk?`<div class="line"><span>Demo extra fee</span><b>${s.outside?m(v.fee):'$0.00'}</b></div>`:''}<p class="muted">Real availability and booking rules are controlled by the playground.</p></aside></div>`}
function walkin(){let v=V.find(x=>x.id===s.venue);app.innerHTML=`<div class="center"><div class="eyebrow">Walk-in redemption · simulated</div><h1>Ready for your visit</h1><p>${v.name} accepts walk-ins in this demo. Follow its on-site admission process.</p></div><div class="ticket"><h2>${v.name}</h2><div class="ticketline"><span>Pass ID</span><b>PP-DEMO-1048</b></div><div class="ticketline"><span>Admissions remaining (demo)</span><b>${s.qty[v.id]}</b></div><div class="notice">Show your pass confirmation at the venue. QR scanning is only illustrated here; actual redemption method must be agreed with the playground.</div><div class="actions"><button class="secondary" onclick="go('passes')">Back to pass</button><button class="primary" onclick="go('home')">Done</button></div></div>`}
function booked(){let v=V.find(x=>x.id===s.venue);app.innerHTML=`<div class="center"><div class="eyebrow">Booking confirmed · simulated</div><h1>You're booked!</h1><p>Illustrative confirmation for an advance-booking venue.</p></div><div class="ticket"><h2>${v.name}</h2><div class="ticketline"><span>Date / time</span><b>${s.date} · ${s.slot}</b></div><div class="ticketline"><span>Demo extra fee</span><b>${s.outside?m(v.fee):'$0.00'}</b></div><div class="qr"><svg viewBox="0 0 21 21" shape-rendering="crispEdges"><rect width="21" height="21" fill="white"/><path fill="#203b61" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zM15 1v5h5V1zM16 2h3v3h-3zM0 14h7v7H0zM1 15v5h5v-5zM2 16h3v3H2zM8 1h2v2H8zM10 4h2v2h-2zM8 7h3v2H8zM12 8h2v2h-2zM8 11h2v2H8zM11 12h2v2h-2zM14 9h2v3h-2zM17 8h2v2h-2zM8 15h2v2H8zM11 16h2v2h-2zM14 14h2v2h-2zM17 12h3v2h-3zM16 17h2v2h-2zM19 19h2v2h-2z"/></svg></div><div class="center muted">Illustrative QR · not valid for real admission</div><div class="actions"><button class="secondary" onclick="go('passes')">My pass</button><button class="primary" onclick="go('home')">Explore more</button></div></div>`}
function go(p){s.page=p;const render=({home,family,select,review,checkout,purchased,account,passes,booking,walkin,booked}[p]||home);const result=render();if(typeof result==='string')app.innerHTML=result;window.scrollTo({top:0,behavior:'smooth'})}
function saveFam(){s.family=s.adults+s.kids;s.ages=s.childAges.filter(a=>a!=='').join(', ');s.gift=$('gift').checked;go('select')}
function change(id,d){s.qty[id]=Math.max(0,s.qty[id]+d);select()}
function buy(){s.email=$('email').value;s.name=$('name').value;if(!s.email.includes('@')){alert('Enter a valid demo email.');return}go('purchased')}
go('home');
</script></body></html>
